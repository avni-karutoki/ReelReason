<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ReelReason favicon: the app's brand mark (lucide Film icon) on the
       indigo-600 to violet-600 gradient used across the studio UI. -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#brand)"/>
  <g transform="translate(8 8) scale(2)" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="20" height="20" rx="2.5"/>
    <path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5"/>
  </g>
</svg>
